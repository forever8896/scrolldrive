<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__TAGLINE__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=__FONT_QUERY__&display=swap" rel="stylesheet">
<style>
  :root { --bg: __BG__; --ink: __INK__; --muted: __MUTED__; --accent: __ACCENT__; --font: "__FONT_FAMILY__"; }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--font), system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .hero { min-height: 92vh; display: grid; align-content: end; justify-items: start; padding: 88px clamp(16px, 6vw, 80px) 12vh; }
  /* Title position, set in the studio: rows t / m / b, columns l / c / r. */
  [data-hero^="t"] .hero { align-content: start; padding-top: 18vh; }
  [data-hero^="m"] .hero, [data-hero="c"] .hero { align-content: center; }
  [data-hero$="c"] .hero, [data-hero="c"] .hero { justify-items: center; text-align: center; }
  [data-hero$="r"] .hero { justify-items: end; text-align: right; }
  h1 { font: 500 clamp(44px, 8.5vw, 128px)/0.98 var(--font), system-ui, sans-serif; letter-spacing: -0.03em; max-width: 14ch; }
  .tagline { margin-top: 22px; color: var(--muted); font-size: clamp(17px, 1.6vw, 21px); max-width: 44ch; }
  .track { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--bg); }
  .stage video, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 35%, transparent) 0%, transparent 30%, transparent 62%, color-mix(in srgb, var(--bg) 70%, transparent) 100%); }
  .fl-beat { font-family: var(--font), system-ui, sans-serif; }
  .blocks { padding: 14vh clamp(16px, 6vw, 80px) 4vh; display: grid; gap: 10vh; }
  .block { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: clamp(20px, 5vw, 80px); align-items: baseline;
    border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); padding-top: 28px; }
  .block h2 { font: 500 clamp(26px, 3vw, 40px)/1.1 var(--font), system-ui, sans-serif; letter-spacing: -0.02em; }
  .block p { color: var(--muted); font-size: clamp(17px, 1.4vw, 20px); max-width: 60ch; white-space: pre-line; }
  .end { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 10vh 16px; }
  .end h2 { font: 500 clamp(36px, 6vw, 84px)/1 var(--font), system-ui, sans-serif; letter-spacing: -0.03em; }
  .cta { display: inline-block; margin-top: 30px; padding: 15px 30px; border-radius: 999px; background: var(--accent);
    color: var(--bg); text-decoration: none; font-weight: 600; transition: transform .25s ease; }
  .cta:active { transform: scale(.98); }
  .static .track { height: auto !important; }
  .static .stage { position: relative; height: auto; min-height: 70vh; padding: 24px 0; }
  .static .fl-stage { position: relative; display: grid; gap: 20px; padding: 60vh var(--gx) 0; }
  .static .fl-beat { position: relative; inset: auto; translate: none; opacity: 1; }
  @media (max-width: 760px) { .block { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: no-preference) {
    .hero h1, .hero .tagline { animation: rise 1.1s cubic-bezier(.16,1,.3,1) both; }
    .hero .tagline { animation-delay: .15s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  }
__TEXTLAYER_CSS__
</style>
</head>
<body data-hero="__HERO__">
  <section class="hero">
    <h1 data-edit="title">__TITLE__</h1>
    <p class="tagline" data-edit="tagline">__TAGLINE__</p>
  </section>

  <section class="track" id="track">
    <div class="stage" id="stage">
      <video id="film" muted playsinline preload="none" poster="poster.jpg"></video>
    </div>
  </section>

  <div class="blocks">__SECTIONS__</div>

  <section class="end">
    <div>
      <h2 data-edit="title">__TITLE__</h2>
      <a class="cta" href="__CTA_HREF__" data-edit="cta.label">__CTA__</a>
    </div>
  </section>

<script>
__TEXTLAYER_JS__
</script>
<script>
(() => {
  const DURATION = __DURATION__;
  const ACTS = __ACTS__;
  const LAYOUT = __LAYOUT__;
  const track = document.getElementById('track');
  const stage = document.getElementById('stage');
  const video = document.getElementById('film');

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches ||
    (navigator.connection && (navigator.connection.saveData || /2g/.test(navigator.connection.effectiveType || '')));
  const scrub = !reduce && matchMedia('(pointer: fine) and (min-width: 900px)').matches;
  const text = FramelineText.mount(stage, ACTS, LAYOUT);

  if (reduce) {
    document.body.classList.add('static');
    const img = document.createElement('img');
    img.src = 'poster.jpg'; img.alt = '';
    video.replaceWith(img);
    return;
  }

  new IntersectionObserver((entries, io) => {
    if (!entries[0].isIntersecting) return;
    video.src = scrub ? 'film.mp4' : 'film-mobile.mp4';
    video.preload = 'auto';
    if (!scrub) { video.loop = true; video.play().catch(() => {}); }
    io.disconnect();
  }, { rootMargin: '150% 0px' }).observe(track);

  const progress = () => {
    const r = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
  };

  if (!scrub) {
    // Touch: the film loops; the lines follow its clock.
    track.style.height = '220vh';
    const tickLoop = () => { if (video.duration) text.show(video.currentTime / video.duration); requestAnimationFrame(tickLoop); };
    requestAnimationFrame(tickLoop);
    return;
  }

  // The scrollbar is the playhead; eased so wheel steps feel like camera inertia.
  track.style.height = `calc(${DURATION * 30}vh + 100vh)`;
  let smooth = 0;
  const tick = () => {
    const goal = progress() * Math.max(0, DURATION - 0.05);
    smooth += (goal - smooth) * 0.14;
    if (video.readyState >= 1 && Math.abs(video.currentTime - smooth) > 0.02) video.currentTime = smooth;
    text.show(smooth / DURATION);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
